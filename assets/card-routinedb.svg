  <rect x="300" y="87" width="40" height="4" fill="url(#card-bayer25-04)" shape-rendering="crispEdges"/>

  <!-- Tech Tags -->
  
        <rect x="64" y="106" width="84" height="18" fill="#050C2A" stroke="#E9EBFF" stroke-width="1" shape-rendering="crispEdges"/>
