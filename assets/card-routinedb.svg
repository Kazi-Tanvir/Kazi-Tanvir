<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 138" width="100%" height="138">
  <defs>
    <pattern id="card-bayer25-04" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#050C2A" />
      <rect x="0" y="0" width="2" height="2" fill="#E9EBFF" />
    </pattern>
    <pattern id="card-bayer50-04" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#050C2A" />
      <rect x="0" y="0" width="2" height="2" fill="#E9EBFF" />
      <rect x="2" y="2" width="2" height="2" fill="#E9EBFF" />
    </pattern>
  </defs>

  <!-- Hard Drop Shadow (4px) -->
  <rect x="6" y="6" width="400" height="128" fill="#050C2A" shape-rendering="crispEdges"/>

